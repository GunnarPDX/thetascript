[package]
name = "theta-script"
version = "2.4.0"
edition = "2021"
description = "Rust core for the open-financial-charts scripting language (spec v2, see spec/SPEC.md)"
license = "MIT"
publish = false

[dependencies]
# float_roundtrip: parse JSON floats exactly (bit-identical to JS JSON.parse)
# — the corpus comparison depends on it
serde_json = { version = "1", features = ["float_roundtrip"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
